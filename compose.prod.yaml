# 프로덕션(미니 PC) 구성. 배포는 ./deploy.sh 로 한다. 로컬 개발은 compose.yaml.
# nginx만 호스트(127.0.0.1:8120)에 열고, 나머지 서비스는 compose 내부 네트워크에만 둔다.
# 비밀 정보는 .env(.env.example 참고)에만 둔다.
name: hero-school

# Django 이미지를 쓰는 서비스(web, worker, beat)의 공통 설정. 새 서비스는 이렇게 더한다:
#   <name>:
#     <<: *django
#     command: ...
x-django: &django
  image: hero-school-app
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://hero_school:${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 필요합니다}@db:5432/hero_school
    DJANGO_MEDIA_ROOT: /app/media
    CELERY_BROKER_URL: redis://redis:6379/0
  volumes:
    - static:/app/staticfiles
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hero_school
      POSTGRES_USER: hero_school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 필요합니다}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero_school -d hero_school"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *django
    build: .
    command: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --no-control-socket

  worker:
    <<: *django
    command: celery -A config worker --loglevel=info --concurrency=2

  # beat는 한 개만 띄운다(둘이면 예약 작업이 두 번 나간다). 이미지가 root가 아닌 사용자로 돌고
  # /app은 쓸 수 없으므로 스케줄 파일은 /tmp에 둔다.
  beat:
    <<: *django
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8120:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - web

volumes:
  db-data:
  static:
  media:
  redis-data:
