# hero-school 프로덕션 nginx. 정적·미디어 파일은 직접 서빙하고 나머지는 gunicorn(web:8000)으로 넘긴다.
# 앞단은 Cloudflare → cloudflared(미니 PC) → 이 nginx(127.0.0.1:8120)다.

# cloudflared가 넘긴 X-Forwarded-Proto(https)를 그대로 전달한다. 없으면 nginx가 받은 스킴을 쓴다.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # web 컨테이너가 다시 만들어지면 IP가 바뀐다. 시작할 때 한 번만 풀지 않도록
    # Docker 내장 DNS로 매번 다시 찾는다(그래서 proxy_pass에 변수를 쓴다).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://web:8000;

    client_max_body_size 10m;
    server_tokens off;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
        expires 1d;
    }

    location / {
        proxy_pass $django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}
