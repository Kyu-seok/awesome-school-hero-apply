<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}신청 관리{% endblock %} | 챔피언스쿨</title>
  <style>
    body { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 0; color: #1f2328; background: #fff; }
    header, main { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #d0d7de; }
    header a { color: inherit; text-decoration: none; font-weight: 700; }
    a { color: #0969da; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #d0d7de; vertical-align: top; }
    .table-wrap { overflow-x: auto; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .tabs a { padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; text-decoration: none; }
    .tabs a[aria-current="page"] { background: #1f2328; color: #fff; border-color: #1f2328; }
    form.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
    form.filters label { display: flex; flex-direction: column; font-size: 13px; gap: 2px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .messages { padding: 8px 12px; background: #dafbe1; border-radius: 6px; list-style: none; }
    .errorlist { color: #cf222e; }
    dl.fields { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
    dl.fields dt { color: #57606a; }
    dl.fields dd { margin: 0; white-space: pre-wrap; }
    textarea { width: 100%; max-width: 640px; min-height: 120px; }
    button { padding: 6px 14px; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'backoffice:application-list' %}">챔피언스쿨 신청 관리</a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'backoffice:logout' %}">
      {% csrf_token %}
      <span>{{ user.get_username }}</span>
      <button type="submit">로그아웃</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% if messages %}
    <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
