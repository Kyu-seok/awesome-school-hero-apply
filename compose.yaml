# 로컬 개발용. 배포 구성(nginx, gunicorn)은 이후 티켓에서 더한다.
name: hero-school

x-app-env: &app-env
  DATABASE_URL: postgres://hero_school:hero_school@db:5432/hero_school
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  # console 백엔드: 메일은 보내지 않고 worker 로그에 찍는다.
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  # 시트 내보내기. 기본은 memory(실제 시트에 쓰지 않음). 실제 시트로 보내려면 .env에
  # EXPORTS_SHEET_BACKEND=google, GOOGLE_SHEETS_SPREADSHEET_ID, GOOGLE_SHEETS_KEY_PATH(호스트의 키 파일)를
  # 넣는다. 키 파일은 worker에 아래 경로로 마운트된다(scripts/setup-google-sheets.sh 참고).
  EXPORTS_SHEET_BACKEND: ${EXPORTS_SHEET_BACKEND:-memory}
  GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
  GOOGLE_SHEETS_WORKSHEET: ${GOOGLE_SHEETS_WORKSHEET:-}
  GOOGLE_SHEETS_CREDENTIALS_FILE: /run/secrets/google-sheets.json

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hero_school
      POSTGRES_USER: hero_school
      POSTGRES_PASSWORD: hero_school
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero_school -d hero_school"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *app-env
    volumes:
      # 서비스 계정 키는 저장소 밖에 두고 읽기 전용으로 마운트한다. 경로가 없으면 빈 파일(/dev/null).
      - ${GOOGLE_SHEETS_KEY_PATH:-/dev/null}:/run/secrets/google-sheets.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 매일 09:00 KST에 오늘의 연락일 안내 발송을 worker에 넣는다. beat는 한 개만 띄운다.
  beat:
    build: .
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
