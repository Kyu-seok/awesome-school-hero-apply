# 로컬 개발용. 배포 구성(nginx, gunicorn)은 이후 티켓에서 더한다.
name: hero-school

x-app-env: &app-env
  DATABASE_URL: postgres://hero_school:hero_school@db:5432/hero_school
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  # console 백엔드: 메일은 보내지 않고 worker 로그에 찍는다.
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hero_school
      POSTGRES_USER: hero_school
      POSTGRES_PASSWORD: hero_school
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero_school -d hero_school"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
